name: P4 native CPU model deployment

on:
  workflow_dispatch:
    inputs:
      macos_only:
        description: Only macOS CPU deployment (targeted lifecycle verification)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cpu_model:
    # Windows installed-worker parity is recorded separately.
    # No P3 disk/drag/packaging rerun here.
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.macos_only &&
          '[{"os":"macos-15","rid":"osx-arm64"}]' ||
          '[{"os":"ubuntu-24.04","rid":"linux-x64"},
          {"os":"macos-15","rid":"osx-arm64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Select a physical temporary directory
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          echo "TMPDIR=$physical_temp/" >> "$GITHUB_ENV"
      - name: Verify terminal-evidence driver
        run: node --test tests/app-probe-driver.test.mjs
      - name: Publish the actual application and CPU worker
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: >-
          dotnet publish src/DeskNest.App/DeskNest.App.csproj
          -c Release -r "$TARGET_RID" --self-contained true
          -o artifacts/p4-cpu-app -m:1 --disable-build-servers
          -p:UseSharedCompilation=false
      - name: Obtain the fixed public model package
        # Approximately 813 MB per runner. The production installer checks
        # the pinned bytes, hash and entries.
        run: |
          archive="${TMPDIR}desknext-laya.zip"
          url='https://github.com/WSXYT/DeskNext/releases/download/model-laya-multilingual-fp32-v1/desknext-laya-multilingual-fp32-v1.zip'
          curl --fail --location --retry 1 --connect-timeout 30 --max-time 300 \
            --proto '=https' --proto-redir '=https' --output "$archive" "$url"
          echo "DESKNEXT_TEST_MODEL_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Install, explicitly activate, reopen and infer with the CPU worker
        timeout-minutes: 4
        run: |
          mkdir -p artifacts/p4-cpu-evidence
          node tests/run-app-probe.mjs artifacts/p4-cpu-app/DeskNest.App \
            --headless-smoke 2>&1 | \
            tee artifacts/p4-cpu-evidence/model-workflow.log
      - name: Preserve application crash reports on macOS failure
        if: failure() && runner.os == 'macOS'
        run: |
          reports="$HOME/Library/Logs/DiagnosticReports"
          mkdir -p artifacts/p4-cpu-evidence
          if [ -d "$reports" ]; then
            find "$reports" -maxdepth 1 -name 'DeskNest*.ips' \
              -exec cp {} artifacts/p4-cpu-evidence/ \;
          fi
      # upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p4-cpu-${{ matrix.rid }}
          path: artifacts/p4-cpu-evidence/
          if-no-files-found: warn
          retention-days: 14
