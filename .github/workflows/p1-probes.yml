name: P1/P2 native and Avalonia probes plus P3 recovery probe

on:
  workflow_dispatch:
    inputs:
      storage_only:
        description: Linux/macOS storage tests only; no UI or packaging
        type: boolean
        default: false
      native_manual_only:
        description: Linux/macOS native clipboard and import UI only
        type: boolean
        default: false
      linux_drag_only:
        description: Isolated Nautilus two-way file and directory drag probe
        type: boolean
        default: false

      macos_drag_only:
        description: Native Finder two-way file and directory drag probe
        type: boolean
        default: false

      windows_storage_only:
        description: Bounded Windows VHDX mount and offline-recovery tests
        type: boolean
        default: false

jobs:
  windows_storage:
    if: ${{ inputs.windows_storage_only }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build targeted native storage tests
        run: >-
          dotnet build tests/DeskNest.Core.Tests/DeskNest.Core.Tests.csproj
          -c Release -m:1 --nodeReuse:false -p:UseSharedCompilation=false
      - name: Exercise owned mounted and unavailable volume boundaries
        timeout-minutes: 8
        shell: pwsh
        run: ./build/windows/Test-MountedVolume.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-mounted-volume-evidence
          path: artifacts/windows-volume-results/
          if-no-files-found: ignore
  macos_drag:
    if: ${{ inputs.macos_drag_only && !inputs.windows_storage_only }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Finder automation and native input permissions
        shell: bash
        run: |
          mkdir -p artifacts/finder-drag
          swiftc tests/finder-input.swift -o artifacts/finder-input
          artifacts/finder-input --preflight 2>&1 | \
            tee artifacts/finder-drag/preflight.log
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Use physical macOS temporary paths
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s/\n' "$physical_temp" >> "$GITHUB_ENV"
      - name: Publish the Finder probe
        run: >-
          dotnet publish src/DeskNest.App/DeskNest.App.csproj -c Release
          -r osx-arm64 --self-contained true -m:1 --nodeReuse:false
          -p:UseSharedCompilation=false -o artifacts/native-manual-ui
      - name: Drag files and directories through Finder and DeskNext
        timeout-minutes: 4
        run: >-
          node tests/finder-drag.mjs artifacts/native-manual-ui/DeskNest.App
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finder-drag-evidence
          path: artifacts/finder-drag/
          if-no-files-found: ignore
  linux_drag:
    if: >-
      ${{ inputs.linux_drag_only && !inputs.macos_drag_only &&
          !inputs.windows_storage_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install isolated X11 file-manager probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nautilus openbox xdotool scrot python3-pyatspi dbus-x11 xdg-utils
      - name: Publish the file-manager probe
        run: >-
          dotnet publish src/DeskNest.App/DeskNest.App.csproj -c Release
          -r linux-x64 --self-contained true -m:1 --nodeReuse:false
          -p:UseSharedCompilation=false -o artifacts/native-manual-ui
      - name: Drag files and directories through Nautilus and DeskNext
        timeout-minutes: 4
        shell: bash
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf -- "$fixture"' EXIT
          export XDG_CONFIG_HOME="$fixture/config"
          export XDG_DATA_HOME="$fixture/data"
          export XDG_CACHE_HOME="$fixture/cache"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          xvfb-run -a -s '-screen 0 1600x900x24' dbus-run-session -- \
            node tests/nautilus-drag.mjs artifacts/native-manual-ui/DeskNest.App
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nautilus-drag-evidence
          path: artifacts/nautilus-drag/
          if-no-files-found: ignore
  native_manual:
    if: >-
      ${{ inputs.native_manual_only && !inputs.linux_drag_only &&
          !inputs.macos_drag_only && !inputs.windows_storage_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Use physical macOS temporary paths
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s/\n' "$physical_temp" >> "$GITHUB_ENV"
      - name: Publish the native UI probe
        run: >-
          dotnet publish src/DeskNest.App/DeskNest.App.csproj -c Release
          -r ${{ matrix.rid }} --self-contained true -m:1 --nodeReuse:false
          -p:UseSharedCompilation=false -o artifacts/native-manual-ui
      - name: Exercise real X11 clipboard and production commands
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: >-
          xvfb-run -a -s '-screen 0 1600x900x24'
          node tests/run-app-probe.mjs artifacts/native-manual-ui/DeskNest.App
          --native-window-smoke --manual-workflow
      - name: Exercise native macOS clipboard and production commands
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: >-
          node tests/run-app-probe.mjs artifacts/native-manual-ui/DeskNest.App
          --native-window-smoke --manual-workflow
  storage:
    if: >-
      ${{ inputs.storage_only && !inputs.native_manual_only &&
          !inputs.linux_drag_only && !inputs.macos_drag_only &&
          !inputs.windows_storage_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Use physical macOS temporary paths
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s/\n' "$physical_temp" >> "$GITHUB_ENV"
      - name: Exercise native storage and recovery contracts
        run: >-
          dotnet test tests/DeskNest.Core.Tests/DeskNest.Core.Tests.csproj
          -c Release -m:1 --nodeReuse:false -p:UseSharedCompilation=false
      - name: Build native recovery probe
        run: >-
          dotnet build
          tests/DeskNest.RecoveryProbe/DeskNest.RecoveryProbe.csproj
          -c Release -m:1 --nodeReuse:false -p:UseSharedCompilation=false
      - name: Force-kill Unix move and recovery boundaries
        timeout-minutes: 3
        run: node tests/recovery-kill.mjs
      - name: Real mounts and capacity-pressure recovery
        timeout-minutes: 5
        shell: bash
        run: bash build/Test-UnixStorage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mount-results-${{ matrix.os }}
          path: artifacts/native-mount-results/
          if-no-files-found: ignore
  probe:
    if: >-
      ${{ !inputs.storage_only && !inputs.native_manual_only &&
          !inputs.linux_drag_only && !inputs.macos_drag_only &&
          !inputs.windows_storage_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Confirm macOS runner architecture matches RID
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Use a physical macOS temporary directory for no-link tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s/\n' "$physical_temp" >> "$GITHUB_ENV"
      - name: Verify probe driver rejects missing or false evidence
        run: node --test tests/app-probe-driver.test.mjs
      - name: Run headless Core and inference unit tests
        run: >-
          dotnet test DeskNest.sln -c Release -m:1
          --nodeReuse:false -p:UseSharedCompilation=false
      - name: Refuse self-copy through a native volume-root alias
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: ./build/windows/Test-VolumeAlias.ps1
      - name: Force-kill recovery boundaries (Windows P3)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $project =
            'tests/DeskNest.RecoveryProbe/DeskNest.RecoveryProbe.csproj'
          dotnet build $project -c Release -m:1 `
            --nodeReuse:false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/recovery-kill.mjs
          exit $LASTEXITCODE
      - name: Build native bridge (Debug, serial)
        run: >-
          cmake -S native/pogget-bridge -B artifacts/native-ci
          -DCMAKE_BUILD_TYPE=Debug
      - name: Compile native bridge and tests
        run: cmake --build artifacts/native-ci --config Debug --parallel 1
      - name: Exercise native ABI and Flow
        run: >-
          ctest --test-dir artifacts/native-ci -C Debug
          --output-on-failure --repeat until-fail:5
      - name: Publish self-contained UI
        run: >-
          dotnet publish src/DeskNest.App/DeskNest.App.csproj -c Release
          -r ${{ matrix.rid }} --self-contained true -m:1 --nodeReuse:false
          -p:UseSharedCompilation=false -o artifacts/publish-ui
      - name: Run UI + native load (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: >-
          node tests/run-app-probe.mjs ./artifacts/publish-ui/DeskNest.App.exe
          --headless-smoke --native-library
          ./artifacts/native-ci/Debug/desknest_pogget.dll
      - name: Run UI + native load (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 2
        run: >-
          node tests/run-app-probe.mjs ./artifacts/publish-ui/DeskNest.App
          --headless-smoke --native-library
          ./artifacts/native-ci/libdesknest_pogget.so
      - name: Run UI + native load (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 2
        run: >-
          node tests/run-app-probe.mjs ./artifacts/publish-ui/DeskNest.App
          --headless-smoke --native-library
          ./artifacts/native-ci/libdesknest_pogget.dylib
      - name: Start real Windows window with isolated state (P2)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: >-
          node tests/run-app-probe.mjs ./artifacts/publish-ui/DeskNest.App.exe
          --native-window-smoke
      - name: Installed unsigned package and recovery probe (P3)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          node --version
          $version = "0.3.0-ci-${{ github.run_id }}"
          $bundle = "artifacts/packages/ci"
          & ./build/Publish-Windows.ps1 -Version $version `
            -OutputRoot $bundle -IncludeRecoveryProbe
          & ./build/windows/Test-Package.ps1 `
            -Bundle "$bundle/DeskNest-win-x64" -NativeWindow -RecoveryProbe `
            -ManualWorkflow
      - name: Start X11 window under Xvfb with isolated state (P2)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        shell: bash
        run: >-
          xvfb-run -a -s '-screen 0 1600x900x24'
          node tests/run-app-probe.mjs ./artifacts/publish-ui/DeskNest.App
          --native-window-smoke
      - name: Start macOS window with isolated state (P2)
        if: runner.os == 'macOS'
        timeout-minutes: 2
        shell: bash
        run: >-
          node tests/run-app-probe.mjs ./artifacts/publish-ui/DeskNest.App
          --native-window-smoke
